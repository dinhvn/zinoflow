        - generic [ref=f60e386]:
          - heading "Ăn gì ở Đà Lạt" [level=2] [ref=f60e387]
          - generic [ref=f60e388]:
            - paragraph [ref=f60e389]: Đà Lạt là một thành phố nổi tiếng với ẩm thực đa dạng và độc đáo. Các món ăn truyền thống như bánh căn, bánh tráng nướng, nem nướng và chè Đà Lạt là những món ăn được nhiều du khách yêu thích.
            - list [ref=f60e390]:
              - listitem [ref=f60e391]:
                - paragraph [ref=f60e392]:
                  - strong [ref=f60e393]: "Bánh căn:"
                  - text: Món bánh này có thể được tìm thấy ở nhiều nơi trên Đà Lạt, nhưng khu vực Đồi Cù và Hẻm 14 là hai nơi nổi tiếng nhất để thưởng thức bánh căn.
              - listitem [ref=f60e394]:
                - paragraph [ref=f60e395]:
                  - strong [ref=f60e396]: "Bánh tráng nướng:"
                  - text: Món ăn này có thể được tìm thấy ở nhiều quán ăn và gian hàng đường phố trên Đà Lạt, nhưng khu vực gần Chợ Đà Lạt và Khu du lịch Hồ Xuân Hương là nơi phổ biến nhất.
              - listitem [ref=f60e397]:
                - paragraph [ref=f60e398]:
                  - strong [ref=f60e399]: "Nem nướng:"
                  - text: Nhiều quán nem nướng tại Đà Lạt được đặt ở khu vực gần Hồ Xuân Hương và Chợ Đà Lạt.
              - listitem [ref=f60e400]:
                - paragraph [ref=f60e401]:
                  - strong [ref=f60e402]: "Chè Đà Lạt:"
                  - text: Chè Đà Lạt là một món ăn truyền thống của Đà Lạt và có thể được tìm thấy ở nhiều quán chè trên thành phố.
              - listitem [ref=f60e403]:
                - paragraph [ref=f60e404]:
                  - strong [ref=f60e405]: "Cafe Đà Lạt:"
                  - text: Không chỉ có các món ăn đặc trưng, Đà Lạt còn được biết đến với café chất lượng cao và hương vị độc đáo của nó. Nhiều quán cà phê tại Đà Lạt có không gian đẹp và không khí lãng mạn, chẳng hạn như Cafe Đinh, Cafe Trại Mát, Cafe Mê Linh,..
        - generic [ref=f60e406]:
          - heading "Đến Đà Lạt bằng cách nào?" [level=2] [ref=f60e407]
          - generic [ref=f60e408]:
            - paragraph [ref=f60e409]:
              - strong [ref=f60e410]: Máy bay
            - paragraph [ref=f60e411]: Các bạn có thể bay thẳng từ TP HCM, Hà Nội, Đà Nẵng, ... đến sân bay Liên Khương(Đà Lạt). Hiện có 3 hãng bay là Vietnam Airlines, VietJet Air và Jetstar với giá dao động từ 900 đến 2 triệu.
            - paragraph [ref=f60e412]: "Lưu ý: Sân bay Liên Khương nằm cách trung tâm Đà Lạt khoảng 31km nên sau khi tới đây bạn có thể bắt xe bus của sân bay với các chuyến xe chạy liên tục trong ngày với giá 50.000 VNĐ hoặc đi xe taxi nhanh chóng và tiện lợi với giá khoảng 300.000 VNĐ."
            - paragraph [ref=f60e413]:
              - strong [ref=f60e414]: Xe khách
            - paragraph [ref=f60e415]: Hầu hết những điểm không quá xa Đà Lạt (<500km) đều có xe khách tới Đà Lạt. Nếu bạn ở Tp HCM thì có thể đi xe của Thành Bưởi hoặc Phương Trang với nhiều chuyến đi liên tục trong ngày. Thời gian đi từ 8 tiếng để đến Đà Lạt giá dao động từ 240.000 VNĐ/ lượt với ghế ngồi hoặc giường nằm.
            - paragraph [ref=f60e416]:
              - strong [ref=f60e417]: Xe máy
            - paragraph [ref=f60e418]: Nếu bạn yêu thích phượt, xe máy là lựa chọn cho trải nghiệm thú vị. Trên tuyến phượt Sài Gòn - Đà Lạt bạn sẽ đi qua 2 con đèo Bảo Lộc và Prenn.
            - paragraph [ref=f60e419]:
              - strong [ref=f60e420]: PHƯƠNG TIỆN ĐI LẠI TẠI ĐÀ LẠT
            - paragraph [ref=f60e421]: Phương tiện đi lại ở Đà Lạt rất đa dạng từ Taxi, buýt, Grap. Nếu bạn thích tự do khám phá thì có thể thuê xe máy với giá từ 100 đến 200k/ngày.
        - generic [ref=f60e422]:
          - heading "Khách sạn giá rẻ tại Đà Lạt" [level=2] [ref=f60e423]
          - paragraph [ref=f60e425]: Đà Lạt có nhiều loại hình lưu trú khác nhau để phục vụ nhu cầu của khách du lịch. Các khách sạn 5 sao tại Đà Lạt sở hữu tiện nghi hiện đại, phong cách thiết kế sang trọng và đẳng cấp, cung cấp các dịch vụ như spa, gym, hồ bơi, nhà hàng sang trọng, phòng hội nghị. Ngoài ra, Đà Lạt còn có nhiều khách sạn 4 sao và 3 sao, homestay đẹp và ấm cúng, phù hợp cho các đoàn du lịch nhỏ hoặc các cặp đôi muốn có không gian riêng tư. Khách sạn và homestay ở Đà Lạt đều sở hữu kiến trúc độc đáo và phong cách thiết kế tùy thuộc vào sở thích của từng khách hàng.
          - generic [ref=f60e426]:
            - text: Dưới đây là danh sách khách sạn giá rẻ bạn có thể ở.
            - link "Xem tất cả" [ref=f60e427] [cursor=pointer]:
